# The same security check the pre-push hook runs on the Mac (Scripts/security_check.sh),
# once more on GitHub for every push: secrets, vulnerable dependencies, code patterns.
name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the scanners
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/bin" gitleaks
          curl -sSfL -o "$HOME/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x "$HOME/bin/osv-scanner"
          python3 -m pip install --quiet semgrep==1.182.0
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Security check
        run: bash Scripts/security_check.sh
